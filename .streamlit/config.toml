[theme]
base = "dark"
primaryColor = "#8BD5C5"
backgroundColor = "#10171C"
secondaryBackgroundColor = "#1A242B"
textColor = "#E9F0F3"
font = "sans serif"
baseRadius = "medium"
showWidgetBorder = true

[client]
# Appearance is controlled by the visible navigation-bar toggle.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
# Local binding is configured by run_local.py, not by this cloud-ready file.
